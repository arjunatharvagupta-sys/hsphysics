<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collision Simulator | HS Physics</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header><div class="container"><h1>HS Physics</h1><p class="tagline">Full-year high school physics companion</p></div></header>
  <nav><div class="container">
    <a href="../index.html">Home</a>
    <a href="momentum.html">5. Momentum</a>
    <a href="collision-sim.html" class="active">Collision Sim</a>
    <a href="../formulas.html">Formulas</a>
  </div></nav>

  <main class="container">
    <div class="unit-header">
      <h2>1D Collision Simulator</h2>
      <p>Elastic or perfectly inelastic. Adjust masses and initial velocities.</p>
    </div>

    <article class="concept">
      <div class="sim-box">
        <canvas id="colCanvas" width="560" height="160"></canvas>
        <div class="controls">
          <label>m₁ <input type="range" id="m1" min="1" max="10" value="2" step="0.5"> <span id="m1val">2</span></label>
          <label>v₁ <input type="range" id="v1" min="-10" max="15" value="8" step="0.5"> <span id="v1val">8</span></label>
          <label>m₂ <input type="range" id="m2" min="1" max="10" value="3" step="0.5"> <span id="m2val">3</span></label>
          <label>v₂ <input type="range" id="v2" min="-10" max="15" value="-2" step="0.5"> <span id="v2val">-2</span></label>
          <label><input type="checkbox" id="elastic" checked> Elastic</label>
          <button id="runBtn">Run</button>
        </div>
        <p style="margin-top:0.75rem;color:var(--muted);font-size:0.88rem">
          After: v₁ = <span id="v1f">—</span> m/s · v₂ = <span id="v2f">—</span> m/s · KE ratio = <span id="keR">—</span>
        </p>
      </div>
    </article>
  </main>
  <footer><div class="container">HS Physics — Collision Sim</div></footer>
  <script>
    const canvas = document.getElementById('colCanvas');
    const ctx = canvas.getContext('2d');
    let x1 = 80, x2 = 320, v1 = 8, v2 = -2, m1 = 2, m2 = 3, running = false, collided = false;

    function size(m) { return 16 + m * 3; }

    function draw() {
      ctx.fillStyle = '#080c10';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#243040';
      ctx.beginPath();
      ctx.moveTo(0, 120);
      ctx.lineTo(canvas.width, 120);
      ctx.stroke();

      const s1 = size(m1), s2 = size(m2);
      ctx.fillStyle = '#5eb8f0';
      ctx.fillRect(x1, 120 - s1, s1, s1);
      ctx.fillStyle = '#81c784';
      ctx.fillRect(x2, 120 - s2, s2, s2);
    }

    function step() {
      if (!running) return;
      const s1 = size(m1), s2 = size(m2);
      x1 += v1 * 0.4;
      x2 += v2 * 0.4;

      if (!collided && x1 + s1 >= x2) {
        collided = true;
        const elastic = document.getElementById('elastic').checked;
        const u1 = v1, u2 = v2;
        if (elastic) {
          v1 = ((m1 - m2) * u1 + 2 * m2 * u2) / (m1 + m2);
          v2 = ((m2 - m1) * u2 + 2 * m1 * u1) / (m1 + m2);
        } else {
          const vf = (m1 * u1 + m2 * u2) / (m1 + m2);
          v1 = v2 = vf;
        }
        const KEi = 0.5 * m1 * u1 * u1 + 0.5 * m2 * u2 * u2;
        const KEf = 0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2;
        document.getElementById('v1f').textContent = v1.toFixed(2);
        document.getElementById('v2f').textContent = v2.toFixed(2);
        document.getElementById('keR').textContent = (KEf / KEi).toFixed(2);
      }

      if (x1 < -50 || x2 > canvas.width + 50) running = false;
      draw();
      requestAnimationFrame(step);
    }

    function run() {
      m1 = parseFloat(document.getElementById('m1').value);
      m2 = parseFloat(document.getElementById('m2').value);
      v1 = parseFloat(document.getElementById('v1').value);
      v2 = parseFloat(document.getElementById('v2').value);
      x1 = 80; x2 = 320; collided = false; running = true;
      document.getElementById('v1f').textContent = '—';
      document.getElementById('v2f').textContent = '—';
      document.getElementById('keR').textContent = '—';
      step();
    }

    ['m1','m2','v1','v2'].forEach(id => {
      document.getElementById(id).oninput = function() {
        document.getElementById(id + 'val').textContent = this.value;
      };
    });
    document.getElementById('runBtn').onclick = run;
    draw();
  </script>
</body>
</html>
